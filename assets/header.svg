<svg width="800" height="160" viewBox="0 0 800 160" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title {
      font-family: "Cormorant Garamond", "Baskerville", "Georgia", "Times New Roman", serif;
      font-size: 46px;
      font-weight: 400;
      letter-spacing: 12px;
      fill: #1f2328;
    }
    .subtitle {
      font-family: "Georgia", "Songti SC", "Noto Serif SC", serif;
      font-style: italic;
      font-size: 14px;
      letter-spacing: 2px;
      fill: #59636e;
    }
    .line {
      stroke: #d0d7de;
      stroke-width: 1;
    }
    @media (prefers-color-scheme: dark) {
      .title { fill: #e6edf3; }
      .subtitle { fill: #8b949e; }
      .line { stroke: #30363d; }
    }
  </style>
  <line x1="280" y1="32" x2="520" y2="32" class="line" />
  <text x="50%" y="84" text-anchor="middle" class="title">SCIERA</text>
  <text x="50%" y="118" text-anchor="middle" class="subtitle">A Letter from the Future of Intelligence</text>
  <line x1="340" y1="140" x2="460" y2="140" class="line" />
</svg>
